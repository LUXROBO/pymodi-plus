
name: PR Test

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Test before merge
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run linting
      run: |
        python -m flake8 modi_plus tests --ignore E203,W503,W504,E501

    - name: Run make test
      run: |
        python --version
        pytest tests/task/ tests/module/input_module/ tests/module/output_module/ -v

    - name: Check test coverage
      run: |
        pytest tests/task/ tests/module/input_module/ tests/module/output_module/ --cov=modi_plus --cov-report=term-missing

  test-status:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed! PR cannot be merged."
            exit 1
          else
            echo "All tests passed! PR is ready to merge."
          fi

